[platformio]
default_envs = nucleo_f411re_master

[env]
platform = ststm32
board = nucleo_f411re
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200

[env:nucleo_f411re_master]
build_flags = -DROLE_MASTER=1
monitor_port = COM6

[env:nucleo_f411re_slave]
build_flags = -DROLE_MASTER=0
monitor_port = COM5
